<style>
/* Un solo mundo visual (juego): fondo tinta azul, acento dorado, cuatro colores de respuesta con figura.

  --bg: #0f1830;
  --surface: #1a2647;
  --surface-2: #24335c;
  --ink: #f3efe4;
  --muted: #a9b3cc;

}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 20% 0%, #1b2a55 0, transparent 45%), radial-gradient(circle at 100% 100%, #2a1f3f 0, transparent 40%);

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.stat3 div { background: var(--surface); border-radius: 12px; padding: 12px; text-align: center; }
.stat3 b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.review { display: flex; flex-direction: column; gap: 10px; }
.review .item { background: var(--surface); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.review .item .yours { color: #ffb4b2; } .review .item .good { color: #9be6b8; }
.tbar { display: flex; flex-direction: column; gap: 6px; }
.tbar div { display: grid; grid-template-columns: 70px 1fr 52px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.tbar span.track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.tbar span.track i { display: block; height: 100%; background: var(--accent); }
.notice { background: var(--surface); border: 2px dashed var(--surface-2); border-radius: 10px; padding: 12px 14px; color: var(--muted); }
.err { color: #ffb4b2; font-weight: 600; }
.wait { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 30px 10px; }
.spinner { width: 54px; height: 54px; border-radius: 50%; border: 6px solid var(--surface-2); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } button { transition: none; } }
footer { margin-top: auto; color: var(--muted); font-size: .8rem; }

<body>
<main id="app" aria-live="polite"></main>
<script>
/* Conexión entre dispositivos sin claude.ai: servidor público de mensajes MQTT por WebSocket seguro.
   Cada participante publica su presencia (apodo, respuesta o estado del juego) como mensaje retenido en
   retobda/v1/<PIN>/p/<id>; todos se suscriben a retobda/v1/<PIN>/p/+. Si alguien se desconecta,
   el servidor borra su presencia (last will). El primer dígito del PIN elige el servidor.
   Expone la interfaz que usa el juego: claude.use("room").join(nombre) -> { presence, onPeers, peers, leave }. */
window.BDA_STANDALONE = true;
(function () {
  const BROKERS = [
    "wss://broker.emqx.io:8084/mqtt",
    "wss://broker.hivemq.com:8884/mqtt",
    "wss://test.mosquitto.org:8081"
  ];
  const LIBS = [
    "https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js",
    "https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"
  ];
  let libP = null;
  function loadLib() {
    if (window.mqtt) return Promise.resolve(true);
    if (libP) return libP;
    libP = (async () => {
      for (const u of LIBS) {
        try {
          await new Promise((res, rej) => { const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
          if (window.mqtt) return true;
        } catch (e) { }
      }
      return false;
    })();
    return libP;
  }
  const rid = () => Math.random().toString(36).slice(2, 10);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function connect(url, id, willTopic) {
    return new Promise((resolve, reject) => {
      let c;
      try {
        c = window.mqtt.connect(url, {
          clientId: "retobda_" + id, keepalive: 15, clean: true, reconnectPeriod: 2000, connectTimeout: 8000,
          will: { topic: willTopic, payload: "", retain: true, qos: 1 }
        });
      } catch (e) { return reject({ code: "network" }); }
      const t = setTimeout(() => { try { c.end(true); } catch (e) { } reject({ code: "network" }); }, 9000);
      c.on("error", () => { });
      c.once("connect", () => { clearTimeout(t); resolve(c); });
    });
  }

  async function join(name, opts) {
    const hub = !!(opts && opts.hub);
    const pin = String(name).replace(/^bda-/, "");
    const url = BROKERS[(Number(pin[0]) - 1 + BROKERS.length * 3) % BROKERS.length];
    const myId = rid(), base = "retobda/v1/" + pin + "/", myTopic = base + "p/" + myId;
    let c;
    try { c = await connect(url, myId, myTopic); }
    catch (e) { throw { code: hub ? "broker" : "network" }; }

    const peers = new Map(), handlers = [];
    let mine = {}, closed = false, fireT = null;
    const snap = () => [...peers].map(([id, v]) => Object.freeze({
      peer: id, by: null, kind: "viewer", guest: false, isMe: id === myId, sameTab: id === myId, presence: v.presence, updatedAt: v.updatedAt
    }));
    const fire = () => {
      if (fireT) return;
      fireT = true;
      Promise.resolve().then(() => {        // microtarea: ningún clearTimeout puede cancelarla
        fireT = null; const ps = snap();
        handlers.slice().forEach(h => { try { h({ peers: ps, joined: [], left: [], updated: ps }); } catch (e) { console.error(e); } });
      });
    };
    const setP = (id, pres) => {
      const s = JSON.stringify(pres), old = peers.get(id);
      if (old && old.s === s) return false;
      peers.set(id, { presence: pres, s, updatedAt: Date.now() }); return true;
    };
    setP(myId, {});
    const pub = () => new Promise((res, rej) => c.publish(myTopic, JSON.stringify(mine), { retain: true, qos: 1 }, err => err ? rej({ code: "network" }) : res()));

    c.on("message", (topic, payload) => {
      if (topic === base + "knock") {       // un jugador busca la sala: el anfitrión vuelve a anunciarse
        if (hub && !closed && mine.role === "host") pub().catch(() => { });
        return;
      }
      if (!topic.startsWith(base + "p/")) return;
      const id = topic.slice(base.length + 2);
      if (!id || id === myId) return;
      const s = payload ? payload.toString() : "";
      if (!s) { if (peers.delete(id)) fire(); return; }
      if (s.length > 6000) return;
      let pres; try { pres = JSON.parse(s); } catch (e) { return; }
      if (!pres || typeof pres !== "object" || Array.isArray(pres)) return;
      if (setP(id, pres)) fire();
    });
    c.on("connect", () => { if (!closed && Object.keys(mine).length) pub().catch(() => { }); });   // al reconectar
    const topics = hub ? { [base + "p/+"]: { qos: 1 }, [base + "knock"]: { qos: 0 } } : { [base + "p/+"]: { qos: 1 } };
    await new Promise((res, rej) => c.subscribe(topics, err => err ? rej({ code: hub ? "broker" : "network" }) : res()));

    const hostHere = () => [...peers].some(([id, v]) => id !== myId && v.presence && v.presence.role === "host");
    /* No basta con el mensaje retenido: algunos brokers públicos lo pierden o tardan en entregarlo, y si el
       anfitrión tuvo un corte breve su "last will" lo borra. El jugador "toca la puerta" y el anfitrión,
       al oírlo, vuelve a publicar su estado. */
    const knock = () => { try { c.publish(base + "knock", "1", { qos: 0, retain: false }); } catch (e) { } };
    if (hub) {
      await sleep(1200);
      if (hostHere()) { try { c.end(true); } catch (e) { } throw { code: "taken" }; }
    } else {
      let waited = 0;
      knock();
      while (!hostHere() && waited < 20000) {
        await sleep(250); waited += 250;
        if (waited % 2000 === 0) knock();
      }
      if (!hostHere()) { try { c.end(true); } catch (e) { } throw { code: "not_found" }; }
    }

    const clear = () => { try { c.publish(myTopic, "", { retain: true, qos: 0 }); } catch (e) { } };
    window.addEventListener("pagehide", clear);
    /* Al volver a la pestaña (p. ej. tras compartir el PIN por otra app en el celular) la conexión pudo
       morir y el broker borró nuestra presencia: reconecta o vuelve a publicarla. Además, el anfitrión
       la reenvía cada 10 s por si el broker la perdió. */
    const refresh = () => {
      if (closed || !Object.keys(mine).length) return;
      if (c.connected) pub().catch(() => { });
      else if (!c.reconnecting) { try { c.reconnect(); } catch (e) { } }
    };
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
    window.addEventListener("online", refresh);
    window.addEventListener("pageshow", refresh);
    const beat = hub ? setInterval(refresh, 10000) : null;

    return {
      name,
      presence: async patch => {
        if (closed) throw { code: "closed" };
        mine = Object.assign({}, mine, patch);
        for (const k in patch) if (patch[k] === null) delete mine[k];
        /* Solo avisa y publica si algo cambió. Antes se avisaba siempre, y como el anfitrión vuelve a
           publicar al recibir el aviso, se formaba un bucle de cientos de mensajes por segundo; los brokers
           públicos lo cortaban y la sala "desaparecía" para los jugadores. */
        if (!setP(myId, Object.assign({}, mine))) return;
        // No se llama a fire(): el anfitrión reacciona a los avisos volviendo a publicar, y su estado
        // incluye el tiempo restante, que siempre cambia; avisarse a sí mismo creaba un bucle sin fin.
        if (!c.connected) throw { code: "disconnected" };
        await pub();
      },
      onPeers: h => { handlers.push(h); fire(); return () => { const i = handlers.indexOf(h); if (i >= 0) handlers.splice(i, 1); }; },
      peers: snap,
      connected: () => !closed && c.connected,
      leave: async () => { closed = true; if (beat) clearInterval(beat); clear(); setTimeout(() => { try { c.end(); } catch (e) { } }, 300); }
    };
  }

  window.claude = { use: async n => (n === "room" && await loadLib() ? { join } : null) };
})();

</script>

/* ===================== Banco de preguntas ===================== */
const BANK = [];
function M(t, s, q, ok, no, e) { BANK.push({ t, s, q, opts: [ok, ...no], c: 0, e, tf: false }); }
function V(t, s, q, v, e) { BANK.push({ t, s, q, opts: ["Verdadero", "Falso"], c: v ? 0 : 1, e, tf: true }); }
// Tema 4. Administración de las estructuras de memoria
// M(tema, seccion, pregunta, correcta, [incorrectas], explicacion)
// V(tema, seccion, afirmacion, esVerdadera, explicacion)
M(4,"4.1","¿Qué forma una instancia de Oracle?","Procesos y estructuras de memoria",["Data files, control files y redo logs","La CDB y todas sus PDBs","El listener y el archivo de passwords"],"La instancia son procesos más memoria; los archivos forman la base de datos.");
M(4,"4.1","En la CDB del curso, ¿cuánta memoria de instancia comparten cdb$root, pdb$seed y las PDBs?","Una sola SGA, porque todas usan la misma instancia",["Una SGA por cada PDB abierta","Una SGA para la raíz y otra compartida por las PDBs","Ninguna; cada PDB solo usa PGA"],"En instancia única hay una instancia para toda la CDB y todos los contenedores comparten su memoria.");
M(4,"4.1","¿Qué es una sesión?","El estado lógico de un usuario autenticado, guardado en memoria de la instancia",["El canal de red o IPC por el que el cliente habla con la instancia", "El programa cliente, como sqlplus, que envía las sentencias", "El proceso del S.O. que ejecuta el SQL en nombre del usuario"],"La conexión es el canal; la sesión es el estado del usuario autenticado.");
V(4,"4.1","Una conexión puede tener cero, una o varias sesiones.",true,"Conexión y sesión son conceptos distintos: una conexión puede llevar varias sesiones.");
M(4,"4.2","¿Qué hace `startup nomount` respecto a la memoria?","Reserva la SGA e inicia los background processes",["Lee los control files","Abre los data files","Crea las PGA de todas las sesiones futuras"],"En nomount solo existen los parámetros, la SGA y los procesos; no se abre ningún archivo de la BD.");
M(4,"4.2","¿Qué es la MGA?","Memoria semi-compartida entre un grupo reducido de procesos, organizada en namespaces",["La porción fija de la SGA que guarda el estado general de la instancia", "Memoria privada de cada server process, igual que la PGA", "El área donde el listener guarda los servicios registrados"],"Managed Global Area: se asigna por demanda y en Linux vive en archivos de /dev/shm.");
M(4,"4.3","En el curso, ¿de qué tamaño es un granule?","4 MB",["8 KB","1 MB","64 MB"],"Con memory_max_target = 2048M el granule mide 4 MB.");
M(4,"4.3","Con memory_max_target = 2048M y granule de 4 MB, ¿cuántos granules tiene la SGA?","512",["256","1024","2048"],"2048 / 4 = 512 granules (y 512 archivos mapeados en /dev/shm).");
M(4,"4.3","Con AMM, el total de `show sga` se parece más a...","memory_max_target",["memory_target","pga_aggregate_target","db_cache_size"],"La instancia reserva espacio para que la SGA pueda crecer hasta memory_max_target.");
M(4,"4.3","¿Qué vista muestra el historial de cambios de tamaño de los componentes de la SGA?","`v$sga_resize_ops`",["`v$sgastat`","`v$sga`","`v$buffer_pool`"],"v$sga_resize_ops (y v$memory_resize_ops para AMM) registran cada ajuste desde el arranque.");
V(4,"4.3","La instancia incrementa memory_target por su cuenta cuando necesita más memoria.",false,"Nunca: solo el DBA lo modifica. AMM reparte dentro de ese presupuesto.");
M(4,"4.3.1","¿Qué es una lectura lógica?","El bloque se encontró en el buffer cache (cache hit)",["El bloque se leyó del data file","Una lectura del diccionario de datos","Una lectura directa a la PGA"],"Lectura lógica = cache hit; lectura física = cache miss y lectura del data file.");
M(4,"4.3.1","Un buffer que contiene cambios aún no escritos al data file está...","Dirty",["Clean","Unused","Pinned"],"Antes de reutilizar un buffer dirty hay que escribirlo a disco (lo hace DBW).");
M(4,"4.3.1","¿Para qué sirve el keep pool?","Retener bloques de objetos pequeños muy consultados",["Descartar rápido bloques de tablas grandes","Guardar bloques de otro tamaño","Guardar el redo"],"Keep retiene; recycle descarta en cuanto dejan de usarse.");
M(4,"4.3.1","Si db_keep_cache_size vale 0 y asignas una tabla a `buffer_pool keep`, ¿qué pasa?","Sus bloques van al default pool",["Error al crear la tabla","La tabla no se puede consultar","Se crea el keep pool automáticamente"],"Con valor 0 el pool no existe y se usa el default.");
M(4,"4.3.1","¿Cuál es el algoritmo de reemplazo de buffers por default?","LRU con touch count",["FIFO","Por temperatura de objeto","Aleatorio"],"El touch count evita que un bloque leído una vez desplace a los populares.");
M(4,"4.3.1","¿Qué es un direct path read?","Leer una tabla grande directo a la PGA sin pasar por el buffer cache",["Leer un registro usando su ROWID desde un índice B-tree", "Leer los bloques más usados directamente del keep pool", "Leer bloques de la Smart Flash Cache en lugar del disco"],"Se usa con tablas grandes para no saturar el buffer cache.");
M(4,"4.3.1","Al configurar Smart Flash Cache en la edición Free y reiniciar, ¿qué ocurre?","La instancia no arranca (ORA-00439)",["Arranca, pero la flash cache se queda deshabilitada", "El parámetro se ignora y se registra un aviso en el alert log", "Arranca solo en nomount hasta corregir el spfile"],"Free no incluye la funcionalidad; hay que corregir el spfile desde un pfile.");
V(4,"4.3.1","Un `commit` provoca que DBW escriba los buffers dirty de la transacción.",false,"El commit escribe REDO (LGWR); los bloques los escribe DBW después.");
M(4,"4.3.1","¿Qué modo de acceso lee la versión más reciente del bloque, incluidos cambios no confirmados?","Current mode",["Consistent mode","Read only mode","Direct mode"],"Current se usa para modificar y cuando la transacción consulta sus propios cambios.");
M(4,"4.3.1","¿Con qué se construye un bloque CR (consistent read)?","Copiando el bloque y aplicándole undo",["Con el redo del online redo log","Leyendo el data file otra vez","Con el result cache"],"El undo permite reconstruir la versión anterior a los cambios no confirmados.");
M(4,"4.3.1","Sesión 1 actualizó una calificación de 10 a 5 sin commit. ¿Qué ve la sesión 2 al consultarla?","10",["5","Error ORA por bloqueo","Nada; espera al commit"],"En read committed lectores y escritores no se bloquean; ve el valor confirmado.");
M(4,"4.3.1","¿Qué mecanismo implementa la DURABILIDAD de ACID?","Redo escrito por LGWR al hacer commit",["Undo","Bloques CR","Restricciones de integridad"],"El commit termina cuando el redo está en disco.");
M(4,"4.3.1","¿Qué mecanismo implementa el AISLAMIENTO en read committed?","Consistent mode con bloques CR",["Redo escrito por LGWR antes del commit", "La regla write-ahead entre DBW y LGWR", "Bloqueos de lectura sobre cada registro consultado"],"Cada consulta ve datos confirmados antes de su inicio.");
V(4,"4.3.1","True Cache es un pool más dentro del buffer cache.",false,"True Cache es OTRA instancia que mantiene bloques en memoria y atiende consultas de solo lectura.");
V(4,"4.3.2","Se genera redo también para los cambios en bloques de undo.",true,"Así el redo protege también al undo, necesario para el rollback tras una falla.");
M(4,"4.3.2","¿Cuál NO provoca una escritura de LGWR?","Que el buffer cache tenga 10% de buffers dirty",["Un commit","Que pasen 3 segundos","Que el redo log buffer esté a un tercio o tenga 1 MB"],"También escribe por write-ahead cuando DBW lo necesita.");
M(4,"4.3.2","¿Qué establece la regla write-ahead?","El redo de un cambio llega a disco antes que el cambio mismo",["Los data files se escriben antes que el redo","El undo se escribe antes que el redo","LGWR espera a DBW"],"Antes de escribir un buffer dirty, su redo ya debe estar en disco.");
M(4,"4.3.2","¿Cómo es el parámetro log_buffer?","Estático: requiere reiniciar",["Dinámico","Lo ajusta AMM","Solo se modifica por PDB"],"El redo log buffer no se ajusta automáticamente.");
M(4,"4.3.2","Justo después del commit, ¿dónde está YA garantizado el cambio?","En los online redo logs",["En los data files","Solo en el buffer cache","En el archived redo log"],"Los data files pueden seguir con el valor anterior hasta que DBW escriba.");
M(4,"4.3.2","Tras una falla de instancia, ¿qué fase reaplica el redo?","Roll forward",["Rollback","Checkpoint","Log switch"],"Luego el rollback deshace con undo lo no confirmado.");
M(4,"4.3.2","Hiciste update SIN commit y se fue la luz. Al arrancar, ¿qué le pasa a tu cambio?","Se deshace en la fase de rollback",["Se conserva","Se pierde el data file","Queda en duda hasta que RECO lo resuelva"],"La instance recovery aplica el redo y luego deshace lo no confirmado.");
M(4,"4.3.3","¿Dónde se guardan el texto, la versión analizada y el plan de una sentencia SQL?","Library cache",["Data dictionary cache","Buffer cache","Large pool"],"Es parte del shared pool.");
M(4,"4.3.3","Reutilizar una sentencia ya analizada se llama...","Soft parse",["Hard parse","Direct path","Full scan"],"El hard parse verifica sintaxis, consulta el diccionario y genera un plan nuevo: es mucho más caro.");
M(4,"4.3.3","¿Por qué `where id = 1` y `where id = 2` provocan cada una un hard parse?","Porque el texto no es idéntico",["Porque cambian los datos","Porque el plan expira","Porque usan índices distintos"],"Solo se reutiliza una sentencia con texto exactamente igual; la solución son variables de enlace.");
M(4,"4.3.3","¿Cuál es una variable de ENLACE?","`where email = :email`",["`where email = '&email'`","`where email = 'a@b.mx'`","`where email = &&email`"],"La de enlace envía el valor por separado; la de sustitución (&) reemplaza texto en el cliente.");
M(4,"4.3.3","En SQL dinámico con execute immediate, ¿cómo se pasan los valores de los binds?","Con la cláusula `using`",["Concatenándolos al texto","Con la cláusula `into`","Con `&` de SQL*Plus"],"Concatenar provoca hard parses y abre la puerta a la inyección SQL.");
V(4,"4.3.3","En SQL estático dentro de PL/SQL, las variables se convierten en binds automáticamente.",true,"El compilador las convierte (por ejemplo en :B1); en SQL dinámico no.");
M(4,"4.3.3","Además del hard parse, ¿qué riesgo tiene concatenar un parámetro en SQL dinámico?","Inyección SQL",["Deadlock","ORA-00845","Pérdida de redo"],"Un valor como `c1' or 1='1` cambia la lógica de la consulta.");
M(4,"4.3.3","En v$librarycache, ¿qué indica un valor alto de `reloads`?","Objetos que salieron por falta de espacio: shared pool pequeño",["Muchas sentencias reutilizadas con soft parse exitoso", "Tablas modificadas que invalidaron sus estadísticas", "Exceso de redo generado por las sesiones activas"],"pinhitratio cercano a 1 es bueno; reloads alto sugiere shared pool pequeño.");
M(4,"4.3.3","5 sesiones ejecutan `select * from mytable`. ¿Cuántas shared SQL areas hay?","1",["5","0","10"],"Hay 1 shared SQL area y 5 private SQL areas.");
M(4,"4.3.3","En modo dedicado, ¿dónde está la private SQL area?","En la PGA",["En el library cache","En el large pool","En /dev/shm"],"Guarda valores de binds y estado de ejecución de cada sesión.");
M(4,"4.3.3","¿Por qué al data dictionary cache se le llama row cache?","Guarda los datos del diccionario como renglones, no como bloques",["Porque guarda los ROWID de todas las tablas del diccionario", "Porque es la parte del bloque llamada row directory", "Porque guarda en memoria filas de las tablas de usuario"],"Responde rápido si la tabla existe, sus columnas y privilegios.");
M(4,"4.3.3","¿Qué guarda el server result cache?","Resultados finales de consultas y funciones PL/SQL",["Bloques de datos leídos de los data files más consultados", "Planes de ejecución y texto analizado de las sentencias", "Redo records pendientes de escribir al online redo log"],"Por default solo guarda consultas con el hint result_cache.");
M(4,"4.3.3","¿Qué parámetro deshabilita el result cache si vale 0?","`result_cache_max_size`",["`shared_pool_size`","`db_cache_size`","`open_cursors`"],"El result cache se invalida al cambiar los datos de los objetos usados.");
M(4,"4.3.3","¿Para qué existe el reserved pool?","Asignaciones contiguas grandes en el shared pool",["Guardar bloques de tablas keep","Guardar la UGA en modo compartido","Reservar memoria para RMAN"],"Protege al resto del shared pool de la fragmentación; default 5%.");
M(4,"4.3.3","¿Qué error indica falta de memoria contigua en el shared pool?","ORA-04031",["ORA-04036","ORA-00845","ORA-01653"],"Apareció al crear el diccionario en la práctica 06 con memory_target = 768M.");
M(4,"4.3.4","¿Dónde está la UGA en modo COMPARTIDO?","En el large pool (o shared pool si no existe)",["En la PGA del shared server que atiende cada llamada", "En el buffer cache, junto a los bloques de la sesión", "En la PGA del dispatcher que recibió la conexión"],"Varias sesiones comparten server processes, así que el estado va a la SGA.");
M(4,"4.3.4","¿Cuál NO es un uso del large pool?","Library cache",["UGA en modo compartido","Buffers de RMAN","Deferred insert pool"],"El library cache está en el shared pool.");
M(4,"4.3.4","Las inserciones con fast ingest (memoptimize_write)...","No generan undo ni redo y pueden perderse si la instancia falla",["Se escriben al instante en disco al hacer commit", "Generan undo y se pueden revertir con rollback", "La sesión las ve de inmediato aunque no estén en disco"],"Se escriben a disco por lotes de forma asíncrona.");
V(4,"4.3.4","Los datos en el deferred insert pool pueden consultarse por la sesión que los insertó.",false,"No se pueden consultar hasta que se escriben a disco.");
M(4,"4.3.5","¿Qué formato usa el In-Memory column store?","Columnar: los valores de cada columna juntos y comprimidos",["Por renglón, igual que el buffer cache pero sin comprimir", "Bloques de 32 KB con registros completos ordenados", "Índices B-tree en memoria sobre las columnas elegidas"],"Favorece consultas analíticas sobre pocas columnas.");
M(4,"4.3.5","¿Cuál es el valor default de inmemory_size?","0 (deshabilitada)",["200 MB","16 GB","10% de la SGA"],"Habilitarla requiere reiniciar la instancia.");
V(4,"4.3.5","Si una tabla está en el column store, el optimizador decide si usa el formato columnar o el buffer cache.",true,"Ambos formatos coexisten y la base los mantiene consistentes.");
M(4,"4.4","¿Dónde se ordenan los registros de un `order by` grande?","En la sort area de la PGA y, si no cabe, en el tablespace temporal",["En el buffer cache, reutilizando los buffers clean", "En el shared pool, junto al plan de la sentencia", "En el large pool, aunque la conexión sea dedicada"],"Las SQL work areas están en la PGA.");
M(4,"4.4","Una work area que hace varias pasadas por el tablespace temporal es...","Multipass",["Optimal","One-pass","Direct path"],"Optimal = todo en memoria; one-pass = una pasada; multipass = varias (impacto severo).");
M(4,"4.4","¿Cuándo se usan sort_area_size y hash_area_size?","Solo con workarea_size_policy = manual",["Siempre, como tope de cada work area de la sesión", "Solo cuando la instancia usa AMM con memory_target", "Solo en sesiones conectadas en modo compartido"],"Con la política auto (default) la instancia calcula el tamaño.");
M(4,"4.4","¿Qué diferencia hay entre pga_aggregate_target y pga_aggregate_limit?","El target es un objetivo que puede excederse; el limit es un tope",["Son sinónimos; el segundo es el nombre anterior", "El limit siempre es menor que el target y nunca se alcanza", "El target es estático y el limit es el valor dinámico"],"La memoria no ajustable puede hacer que se exceda el target.");
M(4,"4.4","¿Qué error se produce al exceder pga_aggregate_limit?","ORA-04036",["ORA-04031","ORA-01652","ORA-00028"],"Se terminan llamadas y luego sesiones con más memoria no ajustable.");
M(4,"4.6","¿Qué parámetro define el presupuesto en AMM?","`memory_target`",["`sga_target`","`memory_size`","`pga_aggregate_limit`"],"memory_target es dinámico; memory_max_target es estático.");
M(4,"4.6","memory_size=0, memory_target=0, sga_target>0. ¿Qué modo usa la instancia?","ASMM",["AMM","Unified Memory","Manual"],"Con sga_target la instancia reparte dentro de la SGA y la PGA se administra aparte.");
M(4,"4.6","¿Qué recomienda la documentación para una instancia de más de 4 GB?","ASMM",["AMM","Manual","Unified Memory siempre"],"AMM hasta 4 GB; en Linux AMM no es compatible con HugePages.");
M(4,"4.6","Con AMM, si además configuras sga_target = 600M, ¿qué significa?","Mínimo garantizado para la SGA",["Máximo que puede alcanzar la SGA", "Se ignora mientras exista memory_target", "Se desactiva AMM y se pasa a ASMM"],"Con AMM, sga_target y pga_aggregate_target actúan como mínimos.");
M(4,"4.6","¿Qué error da memory_max_target mayor que /dev/shm?","ORA-00845",["ORA-56752","ORA-04031","ORA-00439"],"Con AMM la SGA se crea en /dev/shm.");
M(4,"4.6","¿Qué error da al arrancar con memoria mayor al tope de la edición Free (2 GB)?","ORA-56752",["ORA-00845","ORA-56747","ORA-04036"],"El valor se acepta en el spfile pero la instancia no arranca.");
V(4,"4.6","Si el spfile tiene memory_size y memory_target, la instancia arranca con Unified Memory sin avisar.",true,"Deja memory_target y memory_max_target en cero; para volver a AMM: alter system reset memory_size.");
M(4,"4.7","¿Con qué modo de memoria tienen EFECTO los límites de memoria por PDB?","ASMM (sga_target en root, sin memory_target)",["AMM (memory_target en root)", "Cualquier modo de administración", "Solo administración manual de la SGA"],"Con AMM el alter system en la PDB se acepta pero no se aplica.");
M(4,"4.7","¿Qué error se obtiene al poner en una PDB un sga_target mayor que el de cdb$root?","ORA-56747",["ORA-56752","ORA-01950","ORA-04031"],"Los valores de la PDB deben ser menores que los de la raíz.");
M(4,"4.8","¿Por qué `ls /dev/shm` no muestra los archivos de la SGA?","Se mapean en memoria y luego se borran del directorio (unlink)",["Están en $ORACLE_HOME/dbs y no en /dev/shm", "Son archivos ocultos cuyo nombre empieza con punto", "Solo el usuario root puede listarlos en el contenedor"],"La memoria sigue existiendo mientras algún proceso la tenga mapeada.");
M(4,"4.8","En el curso, ¿cuál es el límite de memoria EFECTIVO de la instancia?","El tope de 2 GB de la edición Free",["Los 4 GB de /dev/shm","La RAM del equipo","memory_target de 768 MB siempre"],"La capa más restrictiva que no se puede cambiar sin reiniciar es el tope de Free.");

// Tema 5. Administración de procesos
M(5,"5.1","¿Qué es un user process?","La aplicación cliente que se conecta, como sqlplus",["El proceso que ejecuta el SQL en el servidor","Un background process de la instancia","El listener"],"El server process atiende al user process en el servidor.");
M(5,"5.1","¿Cómo se llaman los background processes en el contenedor del curso?","`db_<proceso>_<sid>`, por ejemplo db_pmon_free",["`ora_<proceso>_<sid>`, por ejemplo ora_pmon_free", "`oracle<sid>`, por ejemplo oraclefree", "`<sid>_<proceso>`, por ejemplo free_pmon"],"Los server processes, en cambio, se llaman oracle<sid>.");
M(5,"5.1","¿Cuál de estos es un daemon, no un proceso de la instancia?","El listener",["PMON","LGWR","DBW0"],"Los daemons no pertenecen a una instancia y pueden servir a varias bases.");
M(5,"5.1","¿Qué distingue a un hilo de un proceso?","El hilo comparte la memoria del proceso al que pertenece",["El hilo tiene su propio PID","El hilo es más costoso de crear","Una falla del hilo nunca afecta al proceso"],"Los hilos tienen TID/LWP dentro del PID de su proceso.");
M(5,"5.1","`ps -L -p <pid de db_bg00>` muestra 12 renglones con el mismo PID. ¿Qué significa?","Un proceso del S.O. con 12 hilos",["Doce procesos del S.O. distintos", "Doce sesiones de usuario abiertas", "Doce PDBs abiertas en la CDB"],"BGnn agrupa varios hilos para tareas de mantenimiento.");
M(5,"5.1","¿Por qué el curso usa threaded_execution = false?","El modo multihilo no soporta autenticación por S.O. (`/ as sysdba`)",["La edición Free no permite ejecutar procesos como hilos", "El modo multihilo consume más memoria que el de procesos", "En modo multihilo PMON deja de existir como proceso"],"En multihilo solo unos pocos procesos siguen siendo procesos del S.O.");
M(5,"5.2","¿Cuál es el modo de conexión por default?","Dedicado",["Compartido","DRCP","Multihilo"],"Un server process exclusivo por conexión.");
M(5,"5.2","En modo dedicado, ¿dónde está la UGA?","En la PGA del server process",["En el large pool","En la request queue","En el control file"],"En modo compartido va a la SGA.");
M(5,"5.2","¿Qué es una conexión bequeath?","Una conexión local donde el cliente crea el server process como hijo",["Una conexión por red que pasa siempre por el listener", "Una conexión que el broker asigna a un pooled server", "Una conexión que el dispatcher atiende con shared servers"],"Hereda el canal de comunicación y no requiere red.");
V(5,"5.2","Una conexión bequeath siempre es dedicada.",true,"El modo compartido requiere Oracle Net (pasar por el listener).");
M(5,"5.2","En `ps -ef`, el server process creado por el listener aparece con...","`(LOCAL=NO)` y PPID 1",["`(LOCAL=YES)` y PPID del sqlplus","`db_s000_free`","`(PROTOCOL=beq)`"],"El listener se desliga del proceso; el de bequeath tiene como padre a sqlplus.");
M(5,"5.2","¿Qué hace el dedicated broker?","Crea server processes dedicados dentro de la instancia",["Entrega conexiones DRCP a los pooled servers del pool", "Recibe peticiones y las deja en la request queue", "Registra los servicios de la instancia en el listener"],"Se habilita con use_dedicated_broker; no confundir con el connection broker de DRCP.");
M(5,"5.2","En modo compartido, ¿con qué proceso se comunica el cliente?","Un dispatcher (Dnnn)",["Un shared server (Snnn)","Un connection broker (Nnnn)","PMON"],"El dispatcher coloca las peticiones en la request queue.");
M(5,"5.2","¿Dónde está la request queue del modo compartido?","En la SGA, y es común a todos los dispatchers",["En la PGA de cada dispatcher, una por dispatcher", "En el listener, que la reparte entre los dispatchers", "En un archivo de traza de cada shared server"],"Las response queues son una por dispatcher.");
M(5,"5.2","¿Qué es un virtual circuit?","Memoria compartida por conexión con sus peticiones y respuestas",["Un enlace de red entre dos bases de datos remotas", "Un hilo de BGnn dedicado a cada conexión compartida", "Un grupo de redo log asignado a cada dispatcher"],"El dispatcher crea uno por cada conexión compartida.");
M(5,"5.2","¿Qué error se obtiene al intentar `shutdown` desde una sesión por dispatcher?","ORA-00106",["ORA-00028","ORA-01013","ORA-00845"],"Las tareas administrativas se hacen en modo dedicado.");
M(5,"5.2","¿En qué caso conviene el modo compartido?","OLTP con miles de conexiones casi siempre inactivas",["Procesos batch largos que están activos todo el tiempo", "Respaldos y recuperación con RMAN en horas pico", "Sesiones de administración que crean índices grandes"],"Su beneficio es la escalabilidad; las sesiones muy activas no lo aprovechan.");
M(5,"5.2","¿Qué único parámetro es REQUERIDO para habilitar el modo compartido?","`shared_servers` mayor a cero",["`max_shared_servers`","`circuits`","`shared_server_sessions`"],"Si solo se configura dispatchers, shared_servers toma el valor 1.");
V(5,"5.2","Los dispatchers se crean bajo demanda hasta max_dispatchers.",false,"No se crean bajo demanda: para agregar más hay que modificar el parámetro dispatchers.");
M(5,"5.2","Para 5000 clientes, ¿qué modo requiere MENOS memoria según la documentación?","DRCP (≈ 615 MB)",["Dedicado (≈ 22 GB)","Compartido (≈ 2.5 GB)","Todos igual"],"DRCP reutiliza procesos y sesiones.");
M(5,"5.2","¿Qué valor de SERVER en CONNECT_DATA pide DRCP?","POOLED",["SHARED","DEDICATED","DRCP"],"En Easy Connect: host:1521/servicio:pooled.");
M(5,"5.2","Si el servicio tiene dispatchers registrados y no indicas SERVER, el listener usa...","El modo compartido",["El modo dedicado","DRCP","Bequeath"],"SERVER=DEDICATED fuerza el dedicado aunque haya dispatchers.");
M(5,"5.2","¿Qué vista muestra los shared servers y su estado WAIT(COMMON)?","`v$shared_server`",["`v$dispatcher`","`v$circuit`","`v$queue`"],"WAIT(COMMON) = libre esperando en la request queue.");
M(5,"5.2","En v$queue, ¿qué tipo tiene la request queue?","COMMON",["DISPATCHER","SHARED","REQUEST"],"Las response queues son de tipo DISPATCHER.");
M(5,"5.2","¿Qué proceso ejecuta las sentencias en DRCP?","Pooled server (Lnnn)",["Shared server (Snnn)","Dispatcher (Dnnn)","Connection broker (Nnnn)"],"El broker entrega la conexión; el pooled server atiende directo al cliente.");
M(5,"5.2","¿Qué reutiliza DRCP que el modo compartido no?","Las sesiones, además de los procesos",["Los dispatchers, además de los procesos", "La request queue común en la SGA", "Los grupos de redo de cada sesión"],"Un pooled server equivale a un server process dedicado junto con su sesión.");
M(5,"5.2","En DRCP, ¿dónde está la UGA?","En la PGA del pooled server",["En la SGA","En el connection broker","En el listener"],"En compartido está en la SGA.");
M(5,"5.2","¿Qué pasa si el pool DRCP llegó a maxsize y no hay pooled servers libres?","La petición espera en cola",["Se crea un server dedicado","Error inmediato","Se usa un shared server"],"Si no llegó al máximo, el broker crea más pooled servers.");
M(5,"5.2","¿Cuál es el default de maxsize en el pool de DRCP?","40",["4","100","Ilimitado"],"minsize 4, maxsize 40, incrsize 2, inactivity_timeout 300 s, max_think_time 120 s.");
M(5,"5.2","¿Cómo se inicia el pool por default de DRCP?","`exec dbms_connection_pool.start_pool();`",["Se inicia solo con la instancia","`alter system set drcp=true;`","`lsnrctl start pool`"],"El pool sys_default_connection_pool ya existe pero hay que iniciarlo.");
V(5,"5.2","Después de reiniciar la instancia, el pool de DRCP queda detenido y hay que volver a iniciarlo.",false,"Sigue iniciado tras reiniciar hasta ejecutar stop_pool.");
M(5,"5.2","En v$cpool_stats, ¿qué cuenta num_hits?","Peticiones que reutilizaron una sesión del pool",["Conexiones rechazadas por haber llegado a maxsize", "Sesiones nuevas que hubo que crear en el pool", "Errores del connection broker desde el arranque"],"num_misses cuenta las veces que hubo que crear sesión nueva.");
M(5,"5.2","¿Qué proceso inicia y detiene los connection brokers y pooled servers?","PMAN",["PMON","SMON","LREG"],"PMAN también maneja dispatchers, shared servers y jobs.");
M(5,"5.3","¿Cuándo se inician los background processes?","Con la instancia, y se detienen con ella",["Cuando se conecta el primer usuario","Al abrir cada PDB","Cuando lo pide el listener"],"Hay obligatorios y opcionales según las funcionalidades activas.");
M(5,"5.3","¿Cuál es un background process OPCIONAL?","ARCn",["PMON","SMON","LGWR"],"ARCn solo existe en modo archivelog.");
M(5,"5.3","¿Qué hace PMON?","Detecta procesos terminados anormalmente",["Escribe redo","Registra servicios en el listener","Toma snapshots del AWR"],"La detección es de PMON; la limpieza la hacen CLMN y CLnn.");
M(5,"5.3","¿Quién COORDINA la limpieza de un proceso terminado?","CLMN",["PMON","PMAN","SMON"],"CLnn son sus auxiliares para limpiar en paralelo.");
V(5,"5.3","Es normal que no exista ningún proceso CLnn.",true,"Su número es proporcional a la limpieza pendiente.");
M(5,"5.3","¿Qué hace el PMON group con un recurso dañado que no puede limpiar?","Lo aísla (quarantine)",["Detiene la instancia","Lo ignora","Lo manda al listener"],"Se consulta en v$quarantine.");
M(5,"5.3","¿Qué recibe una sesión terminada con alter system kill session al ejecutar algo?","ORA-00028: your session has been killed",["ORA-00106: cannot startup/shutdown via dispatcher", "ORA-01013: user requested cancel of current operation", "ORA-03113: end-of-file on communication channel"],"Su transacción sin commit ya fue deshecha.");
M(5,"5.3","¿Qué formato usa alter system kill session?","`'<sid>,<serial#>,@<inst_id>'`",["`'<spid>'`, el PID del sistema operativo", "`'<username>'`, el nombre del usuario", "`'<serial#>,<sid>'` sin la instancia"],"Por ejemplo: alter system kill session '74,18605,@1';");

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rich = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

];

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function points(ms, dur, streak) {           // Puntaje estilo Kahoot: 500-1000 por rapidez + bono de racha
  const f = Math.max(0, Math.min(1, ms / (dur * 1000)));
  return Math.round(1000 - 500 * f) + Math.min(streak, 5) * 100;
}
function makePerm(q) { return q.tf ? [0, 1] : shuffle([0, 1, 2, 3]); }
function pickQuestions(cfg) {
  let pool = BANK.filter(q => cfg.temas.includes(q.t));
  if (cfg.only) pool = BANK.filter(q => cfg.only.includes(q.id));
  pool = shuffle(pool);
  return cfg.n === "all" ? pool : pool.slice(0, cfg.n);
}
const nickClean = s => s.replace(/[^\p{L}\p{N} _.\-]/gu, "").trim().slice(0, 16);

/* ===================== Room (multijugador) ===================== */
let ROOM = null, roomState = "loading";      // loading | ready | off
(async () => {
  try {
    if (!window.claude || typeof window.claude.use !== "function") throw 0;
    ROOM = await window.claude.use("room");
    if (ROOM && !window.BDA_STANDALONE) ROOM = lobbyWrap(ROOM);
    roomState = ROOM ? "ready" : "off";
  } catch (e) { roomState = "off"; }
  if (VIEW === "home") renderHome();
})();
setTimeout(() => { if (roomState === "loading") { roomState = "off"; if (VIEW === "home") renderHome(); } }, 12000);

/* En claude.ai todos comparten la sala general (lobby) y cada partida se separa por PIN en la presencia. */
function lobbyWrap(room) {
  return {
    join: async name => {
      let alive = true; const offs = [];
      await room.presence({ room: name });
      return {
        presence: patch => room.presence(Object.assign({}, patch, { room: name })),
        onPeers: (h, e) => { const off = room.onPeers(ch => { if (alive) h({ peers: ch.peers.filter(p => p.sameTab || (p.presence && p.presence.room === name)) }); }, e); offs.push(off); return off; },
        leave: async () => { alive = false; offs.forEach(f => f()); return room.presence({ room: null, role: null, g: null, a: null, nick: null }); }
      };
    }
  };
}
function netWarn(msg) {
  let el = document.getElementById("netwarn");
  if (!el) { el = document.createElement("p"); el.id = "netwarn"; el.className = "notice err"; document.body.insertBefore(el, $app); }
  el.textContent = msg;
}

/* ===================== Pantallas compartidas ===================== */
/* Los ids de requestAnimationFrame y de setInterval/setTimeout son contadores distintos que se traslapan
   (ambos empiezan en 1). Antes se guardaban en la misma lista y a todos se les aplicaba clearInterval,
   lo que cancelaba temporizadores ajenos —como el que entrega los mensajes de la sala— y dejaba la
   pantalla del jugador congelada. Ahora van en listas separadas. */
let timers = [], frames = [];
function stopTimers() { timers.forEach(clearInterval); frames.forEach(cancelAnimationFrame); timers = []; frames = []; document.onkeydown = null; }
function questionHTML(q, perm, opts) {
  // opts: {interactive, reveal:{dist, chosen}, idx, total, score, streak, hostView}
  const tiles = perm.map((oi, pos) => {
    const color = q.tf ? (oi === 0 ? 1 : 0) : pos;          // V/F: Verdadero azul, Falso rojo
    const cls = ["ans", "c" + color];
    let extra = "";
    if (opts.reveal) {
      if (oi === q.c) cls.push("right"); else cls.push("dim");
      if (opts.reveal.dist) extra = `<span class="count">${opts.reveal.dist[oi] || 0}</span>`;
      else if (opts.reveal.chosen === oi) extra = `<span class="mark">${oi === q.c ? "✔" : "✘"}</span>`;
    }
    const shape = SHAPES[color];
    return `<button class="${cls.join(" ")}" data-opt="${oi}" ${opts.interactive ? "" : "disabled"} aria-label="Opción ${pos + 1}, ${SHAPE_NAMES[color]}">${shape}<span>${rich(q.opts[oi])}</span>${extra}</button>`;
  }).join("");
  return `
    <div class="topbar">
      <span class="pill">${opts.idx + 1} / ${opts.total}</span>
      <span class="pill">Tema ${q.t} · ${TEMAS[q.t]}</span>
      ${opts.score != null ? `<span class="pill gold">${opts.score.toLocaleString("es-MX")} pts${opts.streak > 1 ? ` · racha ${opts.streak}` : ""}</span>` : ""}
    </div>
    <div class="qbox"><span class="sec">Sección ${esc(q.s)}${q.tf ? " · Verdadero o falso" : ""}</span><h2>${rich(q.q)}</h2></div>
    ${opts.reveal ? "" : `<div class="timer"><span class="num" id="tnum"></span><div class="bar"><i id="tbar"></i></div>${opts.extraTimer || ""}</div>`}
    <div class="answers">${tiles}</div>`;
}
function runTimer(deadline, dur, onEnd) {
  const num = document.getElementById("tnum"), bar = document.getElementById("tbar");
  let done = false;
  const tick = () => {
    const left = Math.max(0, deadline - Date.now());
    if (num) num.textContent = Math.ceil(left / 1000);
    if (bar) bar.style.transform = `scaleX(${left / (dur * 1000)})`;
    if (left <= 0 && !done) { done = true; onEnd && onEnd(); return; }
    if (!done) { frames.length = 0; frames.push(requestAnimationFrame(tick)); }
  };
  tick();
  /* requestAnimationFrame se pausa si la pestaña está oculta o la pantalla se apaga: este respaldo hace
     que el tiempo se acabe igual (sobre todo en el anfitrión, que si no, nunca revelaría la respuesta). */
  if (!done) timers.push(setInterval(() => { if (!done && Date.now() >= deadline) tick(); }, 500));
}
function bindAnswers(cb) {
  $app.querySelectorAll(".ans").forEach(b => b.onclick = () => cb(+b.dataset.opt));
  document.onkeydown = e => {
    const k = +e.key; const btns = $app.querySelectorAll(".ans");
    if (k >= 1 && k <= btns.length && !btns[k - 1].disabled) btns[k - 1].click();
  };
}
function leaderboardHTML(rows, mePeer, limit) {
  const top = rows.slice(0, limit);
  const meIdx = rows.findIndex(r => r[0] === mePeer);
  let list = top.map((r, i) => `<li class="${r[0] === mePeer ? "me" : ""}"><span class="pos">${i + 1}</span><span>${esc(r[1])}</span><span>${r[2].toLocaleString("es-MX")}</span></li>`).join("");
  if (meIdx >= limit) list += `<li class="me"><span class="pos">${meIdx + 1}</span><span>${esc(rows[meIdx][1])} (tú)</span><span>${rows[meIdx][2].toLocaleString("es-MX")}</span></li>`;
  return `<div class="lead"><ol>${list || '<li><span></span><span class="muted">Sin jugadores</span><span></span></li>'}</ol></div>`;
}
function reviewHTML(items) {
  if (!items.length) return `<p class="muted">No fallaste ninguna. Excelente.</p>`;
  return `<div class="review">${items.map(it => {
    const q = BANK[it.qid];
    return `<div class="item"><span class="muted">Tema ${q.t} · ${esc(q.s)}</span><b>${rich(q.q)}</b>
      <span class="yours">Tu respuesta: ${it.choice == null ? "sin responder" : rich(q.opts[it.choice])}</span>
      <span class="good">Correcta: ${rich(q.opts[q.c])}</span><span>${rich(q.e)}</span></div>`;
  }).join("")}</div>`;
}
function temaBars(hist) {
  return `<div class="tbar">${[4, 5, 6].filter(t => hist[t]).map(t => {
    const p = Math.round(100 * hist[t].ok / hist[t].n);
    return `<div><span>Tema ${t}</span><span class="track"><i style="width:${p}%"></i></span><span>${p}%</span></div>`;
  }).join("")}</div>`;
}

/* ===================== Modo individual ===================== */
let S = null;
function startSolo(only) {
  const qs = pickQuestions(Object.assign({}, cfg, only ? { only, n: "all" } : {}));
  S = { qs, i: 0, score: 0, streak: 0, log: [], dur: cfg.dur };
  soloQuestion();
}
function soloQuestion() {
  VIEW = "solo"; stopTimers();
  const q = S.qs[S.i], perm = makePerm(q), t0 = Date.now();
  $app.innerHTML = questionHTML(q, perm, { interactive: true, idx: S.i, total: S.qs.length, score: S.score, streak: S.streak })
    + `<div class="row between"><button class="ghost" id="quit">Salir</button></div>`;
  document.getElementById("quit").onclick = renderHome;
  let answered = false;
  const finish = choice => {
    if (answered) return; answered = true; stopTimers();
    const ms = Date.now() - t0, ok = choice === q.c;
    const gain = ok ? points(ms, S.dur, S.streak) : 0;
    S.streak = ok ? S.streak + 1 : 0; S.score += gain;
    S.log.push({ qid: q.id, choice, ok });
    soloReveal(q, perm, choice, ok, gain);
  };
  bindAnswers(finish);
  runTimer(t0 + S.dur * 1000, S.dur, () => finish(null));
}
function soloReveal(q, perm, choice, ok, gain) {
  const last = S.i === S.qs.length - 1;
  $app.innerHTML = `
    <div class="verdict ${ok ? "ok" : "bad"}"><h2>${ok ? "¡Correcto!" : choice == null ? "Se acabó el tiempo" : "Incorrecto"}</h2>
      <span class="pts">+${gain}</span>${ok && S.streak > 1 ? `<span>Racha de ${S.streak}</span>` : ""}</div>
    ${questionHTML(q, perm, { reveal: { chosen: choice }, idx: S.i, total: S.qs.length, score: S.score, streak: S.streak })}
    <div class="expl">${rich(q.e)}</div>
    <div class="row between"><button class="ghost" id="quit">Salir</button><button class="big primary" id="next">${last ? "Ver resultados" : "Siguiente"}</button></div>`;
  document.getElementById("quit").onclick = renderHome;
  const nx = document.getElementById("next"); nx.focus();
  nx.onclick = () => { if (last) soloEnd(); else { S.i++; soloQuestion(); } };
  document.onkeydown = e => { if (e.key === "Enter") nx.click(); };
}
function soloEnd() {
  VIEW = "soloEnd"; stopTimers();
  const okN = S.log.filter(l => l.ok).length, hist = {};
  S.log.forEach(l => { const t = BANK[l.qid].t; hist[t] = hist[t] || { n: 0, ok: 0 }; hist[t].n++; if (l.ok) hist[t].ok++; });
  const best = store("bda.best");
  const isBest = !best || S.score > best.score;
  if (isBest) store("bda.best", { score: S.score, ok: okN, n: S.log.length });
  const wrong = S.log.filter(l => !l.ok);
  $app.innerHTML = `
    <h1>Resultados</h1>
    <div class="stat3"><div><b>${S.score.toLocaleString("es-MX")}</b>puntos${isBest ? " · récord" : ""}</div><div><b>${okN}/${S.log.length}</b>aciertos</div><div><b>${Math.round(100 * okN / S.log.length)}%</b>efectividad</div></div>
    <section class="card"><h3>Por tema</h3>${temaBars(hist)}</section>
    <div class="row"><button class="big primary" id="again">Jugar otra vez</button>${wrong.length ? `<button class="big" id="retry">Repetir las ${wrong.length} falladas</button>` : ""}<button class="ghost" id="home">Inicio</button></div>
    <section class="card"><h3>Preguntas falladas</h3>${reviewHTML(wrong)}</section>`;
  document.getElementById("again").onclick = () => startSolo();
  document.getElementById("home").onclick = renderHome;
  const r = document.getElementById("retry"); if (r) r.onclick = () => startSolo(wrong.map(w => w.qid));
}

/* ===================== Multijugador: anfitrión ===================== */
let H = null;   // estado del anfitrión
async function startHost() {
  VIEW = "host"; stopTimers();
  $app.innerHTML = `<div class="wait"><div class="spinner"></div><p>Creando la sala…</p></div>`;
  let pin, r;
  for (let k = 0; k < 4 && !r; k++) {
    pin = String(100000 + Math.floor(Math.random() * 900000));
    try { r = await ROOM.join("bda-" + pin, { hub: true }); }
    catch (e) { if (!(e && (e.code === "taken" || e.code === "broker"))) return roomError("No se pudo crear la sala (" + (e && e.code || "error") + "). Revisa tu conexión e intenta de nuevo."); }
  }
  if (!r) return roomError("No se pudo conectar con el servidor de salas. Revisa tu internet; algunas redes escolares lo bloquean, prueba con datos móviles.");
  H = { pin, r, qs: [], players: {}, online: new Set(), answers: {}, g: { ph: "lobby", i: 0, n: 0 }, qStart: 0, dur: cfg.dur };
  r.onPeers(onHostPeers, e => roomError("Se perdió la conexión con la sala (" + e.code + ")."));
  pushHost();
  hostLobby();
}
function roomError(msg) {
  VIEW = "err"; stopTimers();
  $app.innerHTML = `<div class="card"><h2>Algo salió mal</h2><p class="err">${esc(msg)}</p><div class="row"><button class="primary" id="home">Volver al inicio</button></div></div>`;
  document.getElementById("home").onclick = () => { leaveRoom(); renderHome(); };
}
function leaveRoom() {
  try { if (H && H.r) H.r.leave(); } catch (e) { }
  try { if (P && P.r) P.r.leave(); } catch (e) { }
  H = null; P = null;
}
function sbRows() {        // [peer, nick, score, streak, lastOk, lastGain]
  return Object.entries(H.players).map(([peer, p]) => [peer, p.nick, p.score, p.streak, p.last, p.gain]).sort((a, b) => b[2] - a[2]);
}
function pushHost() {
  const g = Object.assign({}, H.g);
  if (g.ph === "q") g.left = Math.max(0, H.qStart + H.dur * 1000 - Date.now());
  g.sb = sbRows().slice(0, 45);
  g.np = Object.keys(H.players).length;
  H.r.presence({ role: "host", g }).then(() => { const w = document.getElementById("netwarn"); if (w) w.remove(); })
    .catch(e => netWarn("No se pudo enviar el estado de la sala a los jugadores (" + (e && e.code || "error") + ")."));
}
function onHostPeers(ch) {
  if (!H) return;
  H.online = new Set(ch.peers.filter(p => p.presence && p.presence.role === "player").map(p => p.peer));
  for (const p of ch.peers) {
    const pr = p.presence || {};
    if (pr.role !== "player" || typeof pr.nick !== "string") continue;
    const nick = nickClean(pr.nick) || "Jugador";
    if (!H.players[p.peer]) {
      // ¿Regresa alguien con el mismo apodo que se desconectó? Conserva su puntaje.
      const prev = Object.entries(H.players).find(([pp, d]) => d.nick.toLowerCase() === nick.toLowerCase() && !H.online.has(pp));
      if (prev) { H.players[p.peer] = prev[1]; delete H.players[prev[0]]; }
      else H.players[p.peer] = { nick, score: 0, streak: 0, last: -1, gain: 0, log: [] };
    }
    const a = pr.a;
    if (H.g.ph === "q" && Array.isArray(a) && a[0] === H.g.i && !(p.peer in H.answers) && Number.isInteger(a[1])) {
      const ms = Date.now() - H.qStart;
      if (ms <= H.dur * 1000 + 600) H.answers[p.peer] = { c: a[1], ms };
    }
  }
  if (H.g.ph === "q") {
    H.g.cnt = Object.keys(H.answers).length;
    const online = [...H.online].filter(pe => H.players[pe]);
    if (online.length && online.every(pe => pe in H.answers)) hostReveal();
  }
  pushHost();
  if (VIEW === "host") { if (H.g.ph === "lobby") hostLobby(); else if (H.g.ph === "q") updateHostCount(); }
}
function hostLobby() {
  VIEW = "host";
  const names = Object.entries(H.players).map(([peer, p]) => `<span class="${H.online.has(peer) ? "" : "off"}">${esc(p.nick)}</span>`).join("");
  const n = Object.keys(H.players).length;
  if (!$app.querySelector("#lobby")) {
    $app.innerHTML = `<div id="lobby" style="display:contents">
      <div class="card" style="text-align:center;align-items:center"><span class="lbl">PIN de la sala</span><div class="pinbig">${H.pin}</div>
        <p class="muted">Tus compañeros abren este mismo enlace, eligen <b>Unirme con PIN</b> y escriben este número. Mantén esta pantalla abierta: si la cierras o cambias de app en el celular, la sala deja de verse.</p></div>
      <div class="card"><div class="row between"><h3 id="pcount"></h3></div><div class="players" id="plist"></div></div>
      ${cfgBlock()}
      <div class="row between"><button class="ghost" id="close">Cerrar sala</button><button class="big primary" id="start">Empezar juego</button></div></div>`;
    bindCfg(() => { $app.innerHTML = ""; hostLobby(); });
    document.getElementById("close").onclick = () => { leaveRoom(); renderHome(); };
    document.getElementById("start").onclick = hostStartGame;
  }
  document.getElementById("pcount").textContent = n === 1 ? "1 jugador conectado" : `${n} jugadores conectados`;
  document.getElementById("plist").innerHTML = names || '<span class="off">Esperando jugadores…</span>';
  document.getElementById("start").disabled = n === 0;
}
function hostStartGame() {
  H.dur = cfg.dur; H.qs = pickQuestions(cfg);
  Object.values(H.players).forEach(p => { p.score = 0; p.streak = 0; p.last = -1; p.gain = 0; });
  H.g = { ph: "q", i: -1, n: H.qs.length };
  hostNextQuestion();
}
function hostNextQuestion() {
  stopTimers();
  const i = H.g.i + 1, q = H.qs[i];
  H.answers = {}; H.qStart = Date.now();
  H.g = { ph: "q", i, n: H.qs.length, qid: q.id, perm: makePerm(q), dur: H.dur, cnt: 0 };
  pushHost();
  VIEW = "host";
  $app.innerHTML = questionHTML(q, H.g.perm, { interactive: false, idx: i, total: H.qs.length, extraTimer: `<span class="pill" id="acount"></span>` })
    + `<div class="row between"><button class="ghost" id="end">Terminar juego</button><button id="skip">Cerrar respuestas</button></div>`;
  document.getElementById("end").onclick = hostEnd;
  document.getElementById("skip").onclick = hostReveal;
  updateHostCount();
  runTimer(H.qStart + H.dur * 1000, H.dur, hostReveal);
  timers.push(setInterval(pushHost, 3000));   // reenvía el tiempo restante para quien llegue tarde
}
function updateHostCount() {
  const el = document.getElementById("acount");
  if (el) el.textContent = `${Object.keys(H.answers).length} / ${H.online.size} respuestas`;
}
function hostReveal() {
  if (!H || H.g.ph !== "q") return;
  stopTimers();
  const q = H.qs[H.g.i], dist = q.tf ? [0, 0] : [0, 0, 0, 0];
  for (const [peer, p] of Object.entries(H.players)) {
    const a = H.answers[peer];
    if (a) dist[a.c] = (dist[a.c] || 0) + 1;
    const ok = !!a && a.c === q.c;
    p.gain = ok ? points(a.ms, H.dur, p.streak) : 0;
    p.streak = ok ? p.streak + 1 : 0; p.score += p.gain; p.last = a ? (ok ? 1 : 0) : -1;
  }
  H.g = Object.assign({}, H.g, { ph: "rev", dist, cnt: Object.keys(H.answers).length });
  pushHost();
  const total = Object.keys(H.answers).length, okN = dist[q.c] || 0;
  $app.innerHTML = `
    ${questionHTML(q, H.g.perm, { reveal: { dist }, idx: H.g.i, total: H.qs.length })}
    <div class="expl"><b>${okN} de ${total}</b> acertaron. ${rich(q.e)}</div>
    <div class="row between"><button class="ghost" id="end">Terminar juego</button><button class="big primary" id="board">Ver ranking</button></div>`;
  document.getElementById("end").onclick = hostEnd;
  document.getElementById("board").onclick = hostBoard;
}
function hostBoard() {
  const last = H.g.i >= H.qs.length - 1;
  H.g = Object.assign({}, H.g, { ph: "board" });
  pushHost();
  $app.innerHTML = `<h2>Ranking · pregunta ${H.g.i + 1} de ${H.qs.length}</h2>${leaderboardHTML(sbRows(), null, 5)}
    <div class="row between"><button class="ghost" id="end">Terminar juego</button><button class="big primary" id="next">${last ? "Ver podio" : "Siguiente pregunta"}</button></div>`;
  document.getElementById("end").onclick = hostEnd;
  document.getElementById("next").onclick = last ? hostEnd : hostNextQuestion;
}
function hostEnd() {
  stopTimers();
  H.g = { ph: "end", i: H.g.i, n: H.qs.length };
  pushHost();
  const rows = sbRows();
  const pod = [1, 0, 2].map(k => rows[k] ? `<div class="p${k + 1}"><span>${k + 1}.º</span><b>${esc(rows[k][1])}</b><span>${rows[k][2].toLocaleString("es-MX")}</span></div>` : `<div class="p${k + 1}"></div>`).join("");
  $app.innerHTML = `<h1>Podio</h1><div class="podium">${pod}</div>${leaderboardHTML(rows, null, 50)}
    <div class="row between"><button class="ghost" id="close">Cerrar sala</button><button class="big primary" id="again">Otra partida con la misma sala</button></div>`;
  document.getElementById("close").onclick = () => { leaveRoom(); renderHome(); };
  document.getElementById("again").onclick = () => { H.g = { ph: "lobby", i: 0, n: 0 }; pushHost(); $app.innerHTML = ""; hostLobby(); };
}

/* ===================== Multijugador: jugador ===================== */
let P = null;
function renderJoin(errMsg) {
  VIEW = "join"; stopTimers();
  const nick = store("bda.nick") || "";
  $app.innerHTML = `<h2>Unirme a una sala</h2>
    <form class="card" id="jf">
      <label class="lbl" for="pin">PIN</label><input type="text" id="pin" class="pin-input" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000">
      <label class="lbl" for="nick">Tu apodo</label><input type="text" id="nick" maxlength="16" autocomplete="nickname" value="${esc(nick)}" placeholder="Como te verán en el ranking">
      ${typeof errMsg === "string" ? `<p class="err">${esc(errMsg)}</p>` : ""}
      <div class="row between"><button type="button" class="ghost" id="back">Volver</button><button class="big primary" type="submit">Entrar</button></div>
    </form>`;
  document.getElementById("back").onclick = renderHome;
  document.getElementById("pin").focus();
  document.getElementById("jf").onsubmit = e => {
    e.preventDefault();
    const pin = document.getElementById("pin").value.replace(/\D/g, ""), nk = nickClean(document.getElementById("nick").value);
    if (pin.length !== 6) return renderJoin("El PIN tiene 6 dígitos.");
    if (!nk) return renderJoin("Escribe un apodo (letras o números).");
    store("bda.nick", nk); joinRoom(pin, nk);
  };
}
async function joinRoom(pin, nick) {
  VIEW = "player";
  $app.innerHTML = `<div class="wait"><div class="spinner"></div><p>Buscando la sala ${esc(pin)}… puede tardar unos segundos.</p></div>`;
  let r;
  try { r = await ROOM.join("bda-" + pin); }
  catch (e) {
    return renderJoin(e && e.code === "not_found" ? "Te conectaste al servidor, pero no hay ninguna sala abierta con ese PIN. Revisa el número y que el anfitrión siga en la pantalla del PIN."
      : e && e.code === "network" ? "No se pudo conectar con el servidor de salas. Revisa tu internet; algunas redes escolares lo bloquean, prueba con datos móviles."
      : "No se pudo entrar (" + (e && e.code || "error") + ").");
  }
  P = { r, pin, nick, me: null, hostPeer: null, key: "", log: {}, answered: null, deadline: 0, seenHost: false };
  r.presence({ role: "player", nick }).catch(e => netWarn("No se pudo registrar tu apodo en la sala (" + (e && e.code || "error") + ")."));
  r.onPeers(onPlayerPeers, e => roomError("Se perdió la conexión con la sala (" + e.code + ")."));
  setTimeout(() => { if (P && !P.seenHost && VIEW === "player") { leaveRoomPlayer(); renderJoin("No encontramos una sala con ese PIN. Revisa el número o pide al anfitrión que la cree."); } }, 15000);
}
function leaveRoomPlayer() { try { P && P.r.leave(); } catch (e) { } P = null; }
function onPlayerPeers(ch) {
  if (!P) return;
  const meP = ch.peers.find(p => p.sameTab); if (meP) P.me = meP.peer;
  const host = ch.peers.find(p => p.presence && p.presence.role === "host" && p.presence.g);
  if (!host) {
    if (P.seenHost && VIEW !== "pend") {
      VIEW = "pend"; P.key = ""; stopTimers();
      $app.innerHTML = `<div class="card"><h2>Se perdió la conexión con el anfitrión</h2><p class="muted">Si el anfitrión cerró la sala, la partida terminó. Si solo fue un corte de internet, el juego continuará aquí en cuanto regrese.</p><div class="row"><button class="primary" id="home">Salir al inicio</button></div></div>`;
      document.getElementById("home").onclick = () => { leaveRoomPlayer(); renderHome(); };
    }
    return;
  }
  P.seenHost = true; P.hostPeer = host.peer;
  playerRender(host.presence.g, host.updatedAt);
}
function myRow(g) { return (g.sb || []).find(r => r[0] === P.me); }
function playerRender(g, updatedAt) {
  const key = g.ph + ":" + g.i;
  const row = myRow(g);
  if (g.ph === "q" && typeof g.left === "number") P.deadline = updatedAt + g.left;
  if (key === P.key && g.ph !== "lobby") return;          // misma pantalla; nada que redibujar
  P.key = key; stopTimers(); VIEW = "player";
  const head = `<div class="topbar"><span class="pill">Sala ${esc(P.pin)}</span><span class="pill">${esc(P.nick)}</span>${row ? `<span class="pill gold">${row[2].toLocaleString("es-MX")} pts</span>` : ""}</div>`;
  if (g.ph === "lobby") {
    $app.innerHTML = `${head}<div class="wait"><div class="spinner"></div><h2>¡Ya estás dentro!</h2><p class="muted">Espera a que el anfitrión inicie. ${g.np ? g.np + " jugadores en la sala." : ""}</p></div>
      <div class="row"><button class="ghost" id="leave">Salir</button></div>`;
    document.getElementById("leave").onclick = () => { leaveRoomPlayer(); renderHome(); };
    return;
  }
  const q = BANK[g.qid];
  if (g.ph === "q") {
    if (!q) return;
    P.answered = null;
    $app.innerHTML = questionHTML(q, g.perm, { interactive: true, idx: g.i, total: g.n, score: row ? row[2] : 0, streak: row ? row[3] : 0 });
    const lock = choice => {
      if (P.answered !== null) return;
      P.answered = choice == null ? -1 : choice; stopTimers();
      if (choice != null) P.r.presence({ a: [g.i, choice] }).catch(e => netWarn("No se pudo enviar tu respuesta (" + (e && e.code || "error") + ")."));
      P.log[g.i] = { qid: q.id, choice };
      $app.innerHTML = `${head}<div class="wait"><div class="spinner"></div><h2>${choice == null ? "Se acabó el tiempo" : "Respuesta enviada"}</h2><p class="muted">Esperando a los demás…</p></div>`;
    };
    bindAnswers(lock);
    const dl = P.deadline || Date.now() + g.dur * 1000;
    runTimer(dl, g.dur, () => lock(null));
    return;
  }
  if (g.ph === "rev" && q) {
    const mine = P.log[g.i];
    const choice = mine ? mine.choice : null, ok = choice === q.c;
    if (!mine) P.log[g.i] = { qid: q.id, choice: null };
    $app.innerHTML = `${head}
      <div class="verdict ${ok ? "ok" : choice == null ? "neutral" : "bad"}"><h2>${ok ? "¡Correcto!" : choice == null ? "Sin respuesta" : "Incorrecto"}</h2>
        <span class="pts">+${row ? row[5] : 0}</span>${row && row[3] > 1 ? `<span>Racha de ${row[3]}</span>` : ""}</div>
      ${questionHTML(q, g.perm, { reveal: { chosen: choice }, idx: g.i, total: g.n })}
      <div class="expl">${rich(q.e)}</div>`;
    return;
  }
  if (g.ph === "board") {
    const rows = g.sb || [], pos = rows.findIndex(r => r[0] === P.me);
    $app.innerHTML = `${head}<h2>${pos >= 0 ? `Vas en el lugar ${pos + 1} de ${g.np || rows.length}` : "Ranking"}</h2>${leaderboardHTML(rows, P.me, 5)}<p class="muted">El anfitrión pasará a la siguiente pregunta.</p>`;
    return;
  }
  if (g.ph === "end") {
    const rows = g.sb || [], pos = rows.findIndex(r => r[0] === P.me);
    const wrong = Object.values(P.log).filter(l => l.choice !== BANK[l.qid].c);
    $app.innerHTML = `${head}<h1>${pos === 0 ? "¡Ganaste!" : pos >= 0 ? `Lugar ${pos + 1}` : "Fin del juego"}</h1>
      ${leaderboardHTML(rows, P.me, 10)}
      <section class="card"><h3>Tus preguntas falladas</h3>${reviewHTML(wrong)}</section>
      <div class="row"><button class="ghost" id="leave">Salir de la sala</button><span class="muted">Si el anfitrión inicia otra partida, aparecerá aquí.</span></div>`;
    document.getElementById("leave").onclick = () => { leaveRoomPlayer(); renderHome(); };
    if (g.ph === "end") P.log = Object.assign({}, P.log);
  }
}
/* Al empezar una partida nueva en la misma sala, limpia el historial del jugador */
const _pr = playerRender;
playerRender = function (g, u) { if (P && g.ph === "q" && g.i === 0 && P.key.startsWith("end")) P.log = {}; if (P && g.ph === "lobby" && P.key.startsWith("end")) P.log = {}; _pr(g, u); };

renderHome();
</script>
